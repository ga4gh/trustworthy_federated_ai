services:
  # ==========================================
  # CENTRAL AGGREGATOR TIER
  # ==========================================
  tes-central:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    build:
      context: ../funnel
      dockerfile: Dockerfile
    image: funnel:local
    command: server run --config /etc/funnel/funnel.config.yaml
    ports:
      - "8000:8000"
    networks:
      - fed-network
    volumes:
      - ./configs/central.funnel.config.yaml:/etc/funnel/funnel.config.yaml:ro
      - /opt/funnel/central/work-dir:/opt/funnel/central/work-dir
      - /opt/funnel/central/db:/opt/funnel/central/db
      - /var/run/docker.sock:/var/run/docker.sock
  drs-central:
    image: ga4gh/ga4gh-starter-kit-drs:0.3.2
    ports:
      - "4500:4500"
      - "4501:4501"
    networks:
      - fed-network
    volumes:
      - ./data/central:/data
  # ==========================================
  # CLIENT SITE A (TES + DRS)
  # ==========================================
  tes-site-1:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    image: funnel:local
    command: server run --config /etc/funnel/funnel.config.yaml
    ports:
      - "8001:8000"
    networks:
      - fed-network
    volumes:
      - ./configs/site-1.funnel.config.yaml:/etc/funnel/funnel.config.yaml:ro
      - /opt/funnel/site-1/work-dir:/opt/funnel/site-1/work-dir
      - /opt/funnel/site-1/db:/opt/funnel/site-1/db
      - /var/run/docker.sock:/var/run/docker.sock

  drs-site-1:
    image: ga4gh/ga4gh-starter-kit-drs:0.3.2
    ports:
      - "4502:4500"
      - "4503:4501" 
    networks:
      - fed-network
    volumes:
      - ./data/site_a:/data 

  # ==========================================
  # CLIENT SITE B (TES + DRS)
  # ==========================================
  tes-site-2:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    image: funnel:local
    command: server run --config /etc/funnel/funnel.config.yaml
    ports:
      - "8002:8000"
    networks:
      - fed-network
    volumes:
      - ./configs/site-2.funnel.config.yaml:/etc/funnel/funnel.config.yaml:ro
      - /opt/funnel/site-2/work-dir:/opt/funnel/site-2/work-dir
      - /opt/funnel/site-2/db:/opt/funnel/site-2/db
      - /var/run/docker.sock:/var/run/docker.sock

  drs-site-2:
    image: ga4gh/ga4gh-starter-kit-drs:0.3.2
    ports:
      - "4504:4500"
      - "4505:4501"
    networks:
      - fed-network
    volumes:
      - ./data/site_b:/data

  # ==========================================
  # CLIENT SITE C (TES + DRS)
  # ==========================================
  tes-site-3:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    image: funnel:local
    command: server run --config /etc/funnel/funnel.config.yaml
    ports:
      - "8003:8000"
    networks:
      - fed-network
    volumes:
      - ./configs/site-3.funnel.config.yaml:/etc/funnel/funnel.config.yaml:ro
      - /opt/funnel/site-3/work-dir:/opt/funnel/site-3/work-dir
      - /opt/funnel/site-3/db:/opt/funnel/site-3/db
      - /var/run/docker.sock:/var/run/docker.sock

  drs-site-3:
    image: ga4gh/ga4gh-starter-kit-drs:0.3.2
    ports:
      - "4506:4500"
      - "4507:4501"
    networks:
      - fed-network
    volumes:
      - ./data/site_c:/data
      
  # ==========================================
  # CLIENT SITE D (TES + DRS)
  # ==========================================
  tes-site-4:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    image: funnel:local
    command: server run --config /etc/funnel/funnel.config.yaml
    ports:
      - "8004:8000"
    networks:
      - fed-network
    volumes:
      - ./configs/site-4.funnel.config.yaml:/etc/funnel/funnel.config.yaml:ro
      - /opt/funnel/site-4/work-dir:/opt/funnel/site-4/work-dir
      - /opt/funnel/site-4/db:/opt/funnel/site-4/db
      - /var/run/docker.sock:/var/run/docker.sock

  drs-site-4:
    image: ga4gh/ga4gh-starter-kit-drs:0.3.2
    ports:
      - "4508:4500"
      - "4509:4501"
    networks:
      - fed-network
    volumes:
      - ./data/site_d:/data
  minio:
    image: minio/minio:latest
    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - ./minio-data:/data

    restart: unless-stopped

    networks:
      - fed-network

  # ==========================================
  # AUTOMATED DRS SEEDER
  # ==========================================
  drs-seeder:
    image: curlimages/curl:latest
    depends_on:
      - drs-central
      - drs-site-1
      - drs-site-2
      - drs-site-3
      - drs-site-4
    networks:
      - fed-network
    volumes:
      - ./scripts/seed_drs.sh:/seed_drs.sh
    entrypoint: ["/bin/sh", "/seed_drs.sh"]

networks:
  fed-network:
    driver: bridge